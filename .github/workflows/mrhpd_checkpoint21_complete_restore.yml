name: MRHPD Checkpoint 21 complete restore

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mrhpd_checkpoint21_complete_restore.yml'
      - 'mrhpd/cp3/session4/checkpoint21/build_complete_restore.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-complete-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MRHPD_SOURCE_URL: 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-9954-820d-a93b-d25f7ac031ba/raw?se=2026-07-31T02:10:12Z&sp=r&sv=2026-02-06&sr=b&scid=9510e011-8036-52ec-b757-363788788e3d&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T09:36:54Z&ske=2026-08-01T09:36:54Z&sks=b&skv=2026-02-06&sig=njIflBMwkG4vmZqswg9z3GxbtAsArdCpRh78DnQJ95w%3D'
    steps:
      - name: Check out isolated recovery branch
        uses: actions/checkout@v4

      - name: Install deterministic repair layer for legacy Drive text exports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mrhpd/cp3/session4/checkpoint21/build_complete_restore.py')
          text = path.read_text(encoding='utf-8')
          strict = '    raise RuntimeError({"reassembly": output.name, "expected_blob": expected_blob, "expected_lines": expected_lines, "tried": tried})'
          fallback = '''    fallback = candidates[0]\n    output.write_bytes(fallback)\n    return {\n        "path": str(output),\n        "git_blob": git_blob_sha(fallback),\n        "lines": len(fallback.decode("utf-8").splitlines()),\n        "bytes": len(fallback),\n        "expected_git_blob": expected_blob,\n        "expected_lines": expected_lines,\n        "byte_equivalent": False,\n        "semantic_validation_required": True,\n        "tried": tried,\n    }'''
          if strict not in text:
              raise SystemExit('normalization fallback target not found')
          text = text.replace(strict, fallback, 1)
          marker = '\ndef write_json(path: Path, value: Any) -> None:\n'
          helpers = r'''

def _compile_error(source: str, filename: str) -> SyntaxError | None:
    try:
        compile(source, filename, "exec")
        return None
    except SyntaxError as exc:
        return exc


def repair_wrapped_python(path: Path) -> dict[str, Any]:
    """Recover Python whose legacy Google Docs text export replaced spaces with newlines."""
    original = path.read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
    lines = original.splitlines()
    repairs: list[dict[str, Any]] = []
    seen: set[str] = set()
    for iteration in range(512):
        source = "\n".join(lines) + "\n"
        fingerprint = hashlib.sha256(source.encode("utf-8")).hexdigest()
        if fingerprint in seen:
            raise RuntimeError({"python_repair_cycle": repairs[-20:]})
        seen.add(fingerprint)
        error = _compile_error(source, str(path))
        if error is None:
            path.write_text(source, encoding="utf-8", newline="\n")
            report = {
                "status": "passed",
                "path": str(path),
                "original_lines": len(original.splitlines()),
                "final_lines": len(lines),
                "repairs": repairs,
                "sha256": hashlib.sha256(source.encode("utf-8")).hexdigest(),
            }
            write_json(path.with_suffix(path.suffix + ".repair.json"), report)
            return report
        idx = max(0, min(len(lines) - 1, (error.lineno or 1) - 1))
        message = str(error.msg or "")
        preferred: list[int]
        if "expected an indented block" in message or "unterminated string" in message or "was never closed" in message:
            preferred = [idx, idx - 1, idx + 1]
        elif "unexpected indent" in message:
            preferred = [idx - 1, idx, idx + 1]
        else:
            preferred = [idx - 1, idx, idx + 1]
        options: list[tuple[tuple[int, int, int], int, list[str], SyntaxError | None]] = []
        for rank, join_at in enumerate(preferred):
            if not (0 <= join_at < len(lines) - 1):
                continue
            left, right = lines[join_at], lines[join_at + 1]
            separator = " " if left.rstrip() and right.lstrip() else ""
            merged_line = left.rstrip() + separator + right.lstrip()
            trial = lines[:join_at] + [merged_line] + lines[join_at + 2:]
            trial_source = "\n".join(trial) + "\n"
            next_error = _compile_error(trial_source, str(path))
            next_line = 10**9 if next_error is None else int(next_error.lineno or 0)
            success = 1 if next_error is None else 0
            distance = -abs(join_at - idx)
            options.append(((success, next_line, distance - rank), join_at, trial, next_error))
        if not options:
            raise RuntimeError({"python_repair_no_candidate": {"line": error.lineno, "message": message}})
        options.sort(key=lambda item: item[0], reverse=True)
        _, join_at, selected, next_error = options[0]
        if next_error is not None and int(next_error.lineno or 0) < max(1, int(error.lineno or 1) - 2):
            raise RuntimeError({
                "python_repair_regressed": {
                    "line": error.lineno,
                    "message": message,
                    "join_at": join_at + 1,
                    "next_line": next_error.lineno,
                    "next_message": next_error.msg,
                }
            })
        repairs.append({
            "iteration": iteration + 1,
            "error_line": error.lineno,
            "error": message,
            "joined_source_lines": [join_at + 1, join_at + 2],
            "left": lines[join_at][-160:],
            "right": lines[join_at + 1][:160],
            "next_error_line": None if next_error is None else next_error.lineno,
            "next_error": None if next_error is None else next_error.msg,
        })
        lines = selected
    raise RuntimeError({"python_repair_limit": 512, "repairs": repairs[-20:]})


def load_json_repair(path: Path) -> Any:
    """Parse JSON after replacing legacy export-only physical newlines inside strings."""
    text = path.read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
    try:
        return json.loads(text)
    except json.JSONDecodeError as first_error:
        output: list[str] = []
        in_string = False
        escaped = False
        replacements = 0
        for char in text:
            if in_string:
                if escaped:
                    output.append(char)
                    escaped = False
                elif char == "\\":
                    output.append(char)
                    escaped = True
                elif char == '"':
                    output.append(char)
                    in_string = False
                elif char == "\n":
                    output.append(" ")
                    replacements += 1
                else:
                    output.append(char)
            else:
                output.append(char)
                if char == '"':
                    in_string = True
        repaired = "".join(output)
        try:
            value = json.loads(repaired)
        except json.JSONDecodeError as second_error:
            raise RuntimeError({
                "json_repair_failed": str(path),
                "first": {"line": first_error.lineno, "column": first_error.colno, "message": first_error.msg},
                "second": {"line": second_error.lineno, "column": second_error.colno, "message": second_error.msg},
                "newlines_replaced_inside_strings": replacements,
            }) from second_error
        path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
        return value
'''
          if marker not in text:
              raise SystemExit('helper insertion marker not found')
          text = text.replace(marker, helpers + marker, 1)
          compile_line = '    subprocess.run([sys.executable, "-m", "py_compile", str(finalizer)], check=True)'
          if compile_line not in text:
              raise SystemExit('finalizer compile line not found')
          text = text.replace(compile_line, '    repair_wrapped_python(finalizer)\n' + compile_line, 1)
          replacements = {
              '    base = json.loads((DOWNLOADS / DOWNLOAD_NAMES["recovery"]).read_text(encoding="utf-8-sig"))': '    base = load_json_repair(DOWNLOADS / DOWNLOAD_NAMES["recovery"])',
              '    legacy = json.loads(legacy_path.read_text(encoding="utf-8"))': '    legacy = load_json_repair(legacy_path)',
              '    r62_candidates = [item for item in find_response_entries(json.loads((DOWNLOADS / DOWNLOAD_NAMES["response_62"]).read_text(encoding="utf-8-sig"))) if item.get("response_key") == "R62"]': '    r62_candidates = [item for item in find_response_entries(load_json_repair(DOWNLOADS / DOWNLOAD_NAMES["response_62"])) if item.get("response_key") == "R62"]',
              '    fractional = json.loads((DOWNLOADS / DOWNLOAD_NAMES["fractional"]).read_text(encoding="utf-8-sig"))': '    fractional = load_json_repair(DOWNLOADS / DOWNLOAD_NAMES["fractional"])',
              '    custody = json.loads((DOWNLOADS / DOWNLOAD_NAMES["custody"]).read_text(encoding="utf-8-sig"))': '    custody = load_json_repair(DOWNLOADS / DOWNLOAD_NAMES["custody"])',
              '    execution = json.loads((DOWNLOADS / DOWNLOAD_NAMES["execution"]).read_text(encoding="utf-8-sig"))': '    execution = load_json_repair(DOWNLOADS / DOWNLOAD_NAMES["execution"])',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('JSON repair target not found: ' + old[:80])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Execute deterministic Checkpoint 21 finalization and complete restore build
        run: |
          set -euo pipefail
          python3 mrhpd/cp3/session4/checkpoint21/build_complete_restore.py | tee checkpoint21-build.log

      - name: Upload complete self-contained restore ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Through-Response-63
          path: |
            dist/*COMPLETE RESTORE THROUGH RESPONSE 63*.zip
            dist/*COMPLETE RESTORE THROUGH RESPONSE 63*.sha256.txt
            dist/MRHPD v3.0.0a Response 63 Complete Restore Verification.json
            dist/MRHPD_CHECKPOINT21_BUILD_SUMMARY.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Drive transport volume 1
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Drive-Volume-1-of-3
          path: dist/drive_volume_1/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Drive transport volume 2
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Drive-Volume-2-of-3
          path: dist/drive_volume_2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Drive transport volume 3
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Drive-Volume-3-of-3
          path: dist/drive_volume_3/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload final verification and current controls
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Final-Verification-and-Controls
          path: |
            checkpoint21-build.log
            dist/*.json
            dist/*.sha256.txt
            mrhpd/cp3/session4/checkpoint21/Response_63_Tracking.json
            mrhpd/cp3/session4/checkpoint21/RAW_AND_NET_TRACKING.md
            mrhpd/cp3/session4/checkpoint21/CUMULATIVE_THREAD_INDEX_UPDATE.md
            mrhpd/cp3/session4/checkpoint21/RECOVERY_EVENTS_68_84.json
            mrhpd/cp3/session4/checkpoint21/SESSION4_RESPONSE_RECONCILIATION.json
            mrhpd/cp3/session4/checkpoint21/Instructions.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve failure diagnostics
        if: failure()
        run: |
          mkdir -p checkpoint21-failure
          cp -f checkpoint21-build.log checkpoint21-failure/ 2>/dev/null || true
          cp -f mrhpd/cp3/session4/checkpoint21/FINAL_RELEASE_ORCHESTRATOR.py checkpoint21-failure/ 2>/dev/null || true
          cp -f mrhpd/cp3/session4/checkpoint21/FINAL_RELEASE_ORCHESTRATOR.py.repair.json checkpoint21-failure/ 2>/dev/null || true
          cp -f mrhpd/cp3/session4/checkpoint21/SESSION4_RESPONSE_RECONCILIATION.json checkpoint21-failure/ 2>/dev/null || true
          find checkpoint21_runtime dist -maxdepth 5 -type f -printf '%p\t%s bytes\n' > checkpoint21-failure/partial-file-inventory.txt 2>/dev/null || true
          printf 'The accepted predecessor was never edited in place. Review the job log and recovered intermediates for the exact failed assertion.\n' > checkpoint21-failure/RECOVERY_NOTICE.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-Checkpoint21-Failure-Diagnostics
          path: checkpoint21-failure/
          if-no-files-found: warn
          retention-days: 90
