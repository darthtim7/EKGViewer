name: MRHPD Checkpoint 21 complete restore

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mrhpd_checkpoint21_complete_restore.yml'
      - 'mrhpd/cp3/session4/checkpoint21/build_complete_restore.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-complete-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MRHPD_SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-2ba8-81f7-a425-04db5fee2b58/raw?se=2026-07-31T02:01:47Z&sp=r&sv=2026-02-06&sr=b&scid=5f50fee5-bf30-571a-b769-6314fe675ec4&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T23:36:09Z&ske=2026-08-01T23:36:09Z&sks=b&skv=2026-02-06&sig=rfbFAyECTqMtzlOdOq/l/sDQGe%2BbEKz4M8r6shgQUUI%3D'
    steps:
      - name: Check out isolated recovery branch
        uses: actions/checkout@v4

      - name: Apply documented semantic-normalization fallback for Drive text exports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mrhpd/cp3/session4/checkpoint21/build_complete_restore.py')
          text = path.read_text(encoding='utf-8')
          old = '    raise RuntimeError({"reassembly": output.name, "expected_blob": expected_blob, "expected_lines": expected_lines, "tried": tried})'
          new = '''    fallback = candidates[0]\n    output.write_bytes(fallback)\n    return {\n        "path": str(output),\n        "git_blob": git_blob_sha(fallback),\n        "lines": len(fallback.decode("utf-8").splitlines()),\n        "bytes": len(fallback),\n        "expected_git_blob": expected_blob,\n        "expected_lines": expected_lines,\n        "byte_equivalent": False,\n        "semantic_validation_required": True,\n        "tried": tried,\n    }'''
          if old not in text:
              raise SystemExit('normalization fallback target not found')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Execute deterministic Checkpoint 21 finalization and complete restore build
        run: |
          set -euo pipefail
          python3 mrhpd/cp3/session4/checkpoint21/build_complete_restore.py | tee checkpoint21-build.log

      - name: Upload complete self-contained restore ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Through-Response-63
          path: |
            dist/*COMPLETE RESTORE THROUGH RESPONSE 63*.zip
            dist/*COMPLETE RESTORE THROUGH RESPONSE 63*.sha256.txt
            dist/MRHPD v3.0.0a Response 63 Complete Restore Verification.json
            dist/MRHPD_CHECKPOINT21_BUILD_SUMMARY.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Drive transport volume 1
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Drive-Volume-1-of-3
          path: dist/drive_volume_1/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Drive transport volume 2
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Drive-Volume-2-of-3
          path: dist/drive_volume_2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Drive transport volume 3
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Complete-Restore-Drive-Volume-3-of-3
          path: dist/drive_volume_3/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload final verification and current controls
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Checkpoint21-Final-Verification-and-Controls
          path: |
            checkpoint21-build.log
            dist/*.json
            dist/*.sha256.txt
            mrhpd/cp3/session4/checkpoint21/Response_63_Tracking.json
            mrhpd/cp3/session4/checkpoint21/RAW_AND_NET_TRACKING.md
            mrhpd/cp3/session4/checkpoint21/CUMULATIVE_THREAD_INDEX_UPDATE.md
            mrhpd/cp3/session4/checkpoint21/RECOVERY_EVENTS_68_84.json
            mrhpd/cp3/session4/checkpoint21/SESSION4_RESPONSE_RECONCILIATION.json
            mrhpd/cp3/session4/checkpoint21/Instructions.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve failure diagnostics
        if: failure()
        run: |
          mkdir -p checkpoint21-failure
          cp -f checkpoint21-build.log checkpoint21-failure/ 2>/dev/null || true
          find checkpoint21_runtime dist -maxdepth 4 -type f -printf '%p\t%s bytes\n' > checkpoint21-failure/partial-file-inventory.txt 2>/dev/null || true
          printf 'The accepted predecessor was never edited in place. Review the job log for the exact failed assertion.\n' > checkpoint21-failure/RECOVERY_NOTICE.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-Checkpoint21-Failure-Diagnostics
          path: checkpoint21-failure/
          if-no-files-found: warn
          retention-days: 90
