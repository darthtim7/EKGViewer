name: MRHPD Section 5 Session 1 Checkpoint 2 recovery

on:
  pull_request:
    paths:
      - 'mrhpd/cp5/session1/checkpoint2/**'
      - '.github/workflows/mrhpd-cp5-s1-cp2-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-checkpoint-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 python-docx==1.2.0 reportlab==4.4.3 pypdf==5.9.0 pymupdf==1.26.4 pillow==12.3.0
      - name: Download Response 72 volume 1
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-72-Complete-Restore-Volume-1-of-2-v2
          path: inputs/volume1
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30677563971
      - name: Download Response 72 volume 2
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-72-Complete-Restore-Volume-2-of-2-v2
          path: inputs/volume2
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30677563971
      - name: Download Response 75 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-75-Section-5-Session-1-Checkpoint-1-Recovery-Delivery
          path: inputs/checkpoint1
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30684701837
      - name: Normalize and compile builders
        run: |
          python mrhpd/cp5/session1/checkpoint2/normalize_checkpoint2_builder.py
          python -m py_compile mrhpd/cp5/session1/checkpoint2/section5_checkpoint2_reporting.py
          python -m py_compile mrhpd/cp5/session1/checkpoint2/build_section5_checkpoint2.py
          python -m py_compile mrhpd/cp5/session1/checkpoint2/verify_checkpoint2_outputs.py
      - name: Build checkpoint
        run: |
          python mrhpd/cp5/session1/checkpoint2/build_section5_checkpoint2.py --volume1-dir inputs/volume1 --volume2-dir inputs/volume2 --checkpoint1-dir inputs/checkpoint1 --dist dist_cp5_s1_cp2 | tee section5-checkpoint2-build.log
      - name: Independently verify outputs
        run: python mrhpd/cp5/session1/checkpoint2/verify_checkpoint2_outputs.py dist_cp5_s1_cp2 | tee section5-checkpoint2-verification.log
      - name: Upload checkpoint delivery
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-76-Section-5-Session-1-Checkpoint-2-Recovery-Delivery
          path: |
            dist_cp5_s1_cp2/MRHPD v3.0.0a Response 76 Section 5 Session 1 Checkpoint 2 Recovery Package *.zip
            dist_cp5_s1_cp2/MRHPD v3.0.0a Response 76 Checkpoint 2 Recovery Verification.json
            dist_cp5_s1_cp2/MRHPD_RESPONSE76_SECTION5_CHECKPOINT2_BUILD_SUMMARY.json
            dist_cp5_s1_cp2/MRHPD v3.0.0a Response 76 Exact File Names.txt
            section5-checkpoint2-build.log
            section5-checkpoint2-verification.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-76-Section-5-Checkpoint-2-Failure-Diagnostics
          path: |
            mrhpd/cp5/session1/checkpoint2
            section5-checkpoint2-build.log
            dist_cp5_s1_cp2
          if-no-files-found: warn
          retention-days: 30
