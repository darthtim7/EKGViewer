name: MRHPD find Response 75 artifacts

on:
  push:
    branches:
      - mrhpd-section5-runner-20260801
    paths:
      - .github/workflows/mrhpd_find_response75_artifacts.yml

permissions:
  actions: read
  contents: read

jobs:
  find-response75:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query repository artifacts and workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']
          repo=os.environ['GH_REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          artifacts=[]
          page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  data=json.load(r)
              batch=data.get('artifacts',[])
              artifacts.extend(batch)
              if len(batch)<100: break
              page+=1
          hits=[]
          for a in artifacts:
              name=a.get('name','')
              low=name.lower()
              if ('response-75' in low or 'response 75' in low or 'section-5' in low or 'section 5' in low) and not a.get('expired'):
                  hits.append({
                      'id':a.get('id'),'name':name,'size_in_bytes':a.get('size_in_bytes'),
                      'created_at':a.get('created_at'),'expires_at':a.get('expires_at'),
                      'digest':a.get('digest'),'workflow_run':a.get('workflow_run')
                  })
          print(json.dumps({'status':'passed','artifact_count':len(artifacts),'hits':hits},indent=2))
          if not hits:
              raise SystemExit('No nonexpired Response 75 / Section 5 artifact found')
          PY
