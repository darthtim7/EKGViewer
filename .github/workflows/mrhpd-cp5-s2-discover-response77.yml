name: MRHPD Section 5 Session 2 discover Response 77 artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mrhpd-cp5-s2-discover-response77.yml'
      - 'mrhpd/cp5/session2/checkpoint1/**'

permissions:
  contents: read
  actions: read

jobs:
  discover-response77-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Discover Response 77 and terminal Session 1 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]' > discovery/all-artifacts.ndjson
          python - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for line in Path('discovery/all-artifacts.ndjson').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row=json.loads(line)
              name=row.get('name','')
              if any(token in name for token in (
                  'Response-77',
                  'Response-78-Complete-Restore',
                  'Response-78-Section-5-Session-1-Complete',
                  'Session-1-Complete-Restore',
              )):
                  rows.append({
                      'id':row.get('id'),
                      'name':name,
                      'size_in_bytes':row.get('size_in_bytes'),
                      'created_at':row.get('created_at'),
                      'expires_at':row.get('expires_at'),
                      'expired':row.get('expired'),
                      'digest':row.get('digest'),
                      'workflow_run':row.get('workflow_run'),
                      'archive_download_url':row.get('archive_download_url'),
                  })
          rows.sort(key=lambda r:(r.get('created_at') or '', r.get('id') or 0), reverse=True)
          out={
              'schema':'mrhpd-response77-artifact-discovery-1.0',
              'status':'passed' if rows else 'failed',
              'artifact_count':len(rows),
              'artifacts':rows,
          }
          Path('discovery/MRHPD_RESPONSE77_ARTIFACT_DISCOVERY.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          if not rows:
              raise SystemExit('No Response 77 / Session 1 complete artifacts found')
          PY
      - name: Upload discovery record
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-Response-77-Artifact-Discovery
          path: discovery/MRHPD_RESPONSE77_ARTIFACT_DISCOVERY.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
