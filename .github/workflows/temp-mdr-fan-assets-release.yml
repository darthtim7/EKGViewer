name: Cleanup temporary MDR acquisition infrastructure

on:
  pull_request:
    paths:
      - 'mdr-fan-assets-trigger.txt'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release, artifacts, PR, and branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete mdr-fan-assets-acquisition-32216708547 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          for artifact in 9352687216 9352830908 9353585856 9353586385 9353587061; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" || true
          done
          gh pr close 14 --repo "$GITHUB_REPOSITORY" --comment "Acquisition complete. Substantive local and Google Drive copies were byte-verified; temporary infrastructure is being removed." || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/temp-mdr-fan-assets-acquisition" || true
