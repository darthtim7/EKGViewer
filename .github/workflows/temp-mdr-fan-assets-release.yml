name: Temporary MDR fan asset acquisition release

on:
  pull_request:
    paths:
      - 'mdr-fan-assets-trigger.txt'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and package Lumon-Industries MDR repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquired
          git clone --depth 1 https://github.com/Lumon-Industries/Macrodata-Refinement.git acquired/Macrodata-Refinement
          git -C acquired/Macrodata-Refinement rev-parse HEAD > acquired/SOURCE_COMMIT.txt
          git -C acquired/Macrodata-Refinement remote get-url origin > acquired/SOURCE_URL.txt
          printf '%s\n' 'Temporary acquisition copy for the MDR terminal project. Upstream provenance retained; no claim of production authenticity or upstream licensing.' > acquired/ACQUISITION_NOTE.txt
          rm -rf acquired/Macrodata-Refinement/.git
          find acquired/Macrodata-Refinement -type f -print0 | sort -z | xargs -0 sha256sum > acquired/FILE_SHA256.txt
          find acquired/Macrodata-Refinement -type f | sort > acquired/FILE_INVENTORY.txt
          (cd acquired && zip -r -9 ../Lumon_Industries_Macrodata_Refinement_complete.zip .)
          sha256sum Lumon_Industries_Macrodata_Refinement_complete.zip > ACQUIRED_ARCHIVE_SHA256.txt

      - name: Upload acquisition as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumon-Industries-Macrodata-Refinement-project-acquisition
          path: |
            Lumon_Industries_Macrodata_Refinement_complete.zip
            ACQUIRED_ARCHIVE_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
