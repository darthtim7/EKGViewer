name: MRHPD Section 5 Session 2 Checkpoint 2 recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mrhpd/cp5/session2/checkpoint2/**'
      - '.github/workflows/mrhpd-cp5-s2-cp2-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-checkpoint-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned document workbook PDF image and indexing dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            openpyxl==3.1.5 python-docx==1.2.0 reportlab==4.4.3 \
            pypdf==5.9.0 pymupdf==1.26.4 pillow==12.3.0
      - name: Download Response 77 volume 1
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-77-Complete-Restore-Volume-1-v2
          path: inputs/response77/volume1
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30694922808
      - name: Download Response 77 volume 2
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-77-Complete-Restore-Volume-2-v2
          path: inputs/response77/volume2
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30694922808
      - name: Download Response 77 volume 3
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-77-Complete-Restore-Volume-3-v2
          path: inputs/response77/volume3
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30694922808
      - name: Download Response 79 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-79-Section-5-Session-2-Checkpoint-1-Recovery-Delivery
          path: inputs/response79
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30698058503
      - name: Compile Session 2 Checkpoint 2 builders
        run: |
          set -euo pipefail
          python -m py_compile mrhpd/cp5/session2/checkpoint1/inspect_response77.py
          python -m py_compile mrhpd/cp5/session2/checkpoint2/build_section5_session2_checkpoint2.py
          python -m py_compile mrhpd/cp5/session2/checkpoint2/verify_section5_session2_checkpoint2.py
      - name: Build and clean-verify checkpoint recovery
        run: |
          set -euo pipefail
          python mrhpd/cp5/session2/checkpoint2/build_section5_session2_checkpoint2.py \
            --response77-dir inputs/response77 \
            --response79-dir inputs/response79 \
            --dist dist_cp5_s2_cp2 | tee section5-session2-checkpoint2-build.log
      - name: Independently verify emitted outputs
        run: |
          set -euo pipefail
          python mrhpd/cp5/session2/checkpoint2/verify_section5_session2_checkpoint2.py \
            dist_cp5_s2_cp2 | tee section5-session2-checkpoint2-verification.log
      - name: Upload Response 80 checkpoint recovery delivery
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-80-Section-5-Session-2-Checkpoint-2-Recovery-Delivery
          path: |
            dist_cp5_s2_cp2/MRHPD v3.0.0a Response 80 Section 5 Session 2 Checkpoint 2 Recovery Package *.zip
            dist_cp5_s2_cp2/MRHPD v3.0.0a Response 80 Checkpoint 2 Recovery Verification.json
            dist_cp5_s2_cp2/MRHPD_RESPONSE80_SECTION5_SESSION2_CHECKPOINT2_BUILD_SUMMARY.json
            dist_cp5_s2_cp2/MRHPD v3.0.0a Response 80 Exact File Names.txt
            section5-session2-checkpoint2-build.log
            section5-session2-checkpoint2-verification.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-80-Section-5-Session-2-Checkpoint-2-Failure-Diagnostics
          path: |
            mrhpd/cp5/session2/checkpoint2
            dist_cp5_s2_cp2
            section5-session2-checkpoint2-build.log
            section5-session2-checkpoint2-verification.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
