name: MRHPD Checkpoint 21 restore preflight

on:
  push:
    branches:
      - mrhpd-recovery-runner-20260730
    paths:
      - '.github/workflows/mrhpd_checkpoint21_restore_preflight.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mrhpd_checkpoint21_restore_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-ded4-822f-8614-c0d9c7a50e51/raw?se=2026-07-31T01:51:33Z&sp=r&sv=2026-02-06&sr=b&scid=6a85fa1e-7784-5b0c-9700-ea54640f27f8&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T08:19:12Z&ske=2026-08-01T08:19:12Z&sks=b&skv=2026-02-06&sig=Igvt0pxgTMLAKlJusjbwY2S7jMUhHs4fcT14JharbMM%3D'
      FINALIZER_PART1_URL: 'https://at.adobe.com/1c0na7Hw8xfKC2Vx'
      AUDIT_URL: 'https://at.adobe.com/A6kphh4trMBRHjJ2'
    steps:
      - name: Verify public runner
        run: |
          set -euxo pipefail
          python3 --version
          uname -a

      - name: Verify temporary source transport without full download
        run: |
          set -euxo pipefail
          mkdir -p preflight
          curl -L --fail --retry 3 --range 0-1023 "$SOURCE_URL" -o preflight/source-head.bin
          python3 - <<'PY'
          from pathlib import Path
          data = Path('preflight/source-head.bin').read_bytes()
          print({'bytes': len(data), 'prefix_hex': data[:16].hex(), 'zip_signature': data.startswith(b'PK')})
          if not data.startswith(b'PK'):
              raise SystemExit('source wrapper does not begin with ZIP signature')
          PY

      - name: Verify Adobe-migrated finalizer and audit transports
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "$FINALIZER_PART1_URL" -o preflight/finalizer-part1.txt
          curl -L --fail --retry 3 "$AUDIT_URL" -o preflight/checkpoint21_full_acceptance_audit.py
          wc -c preflight/finalizer-part1.txt preflight/checkpoint21_full_acceptance_audit.py
          head -n 3 preflight/finalizer-part1.txt
          python3 -m py_compile preflight/checkpoint21_full_acceptance_audit.py
          python3 preflight/checkpoint21_full_acceptance_audit.py --help | tee preflight/audit-help.txt

      - name: Record preflight
        run: |
          set -euo pipefail
          cat > preflight/PREFLIGHT_STATUS.txt <<'EOF'
          MRHPD Checkpoint 21 public restore preflight completed.
          Public GitHub Actions runner started.
          Accepted-source wrapper transport returned ZIP bytes.
          Adobe-migrated finalizer source and independent audit downloaded.
          Independent audit compiled and exposed its command-line interface.
          EOF

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-Checkpoint21-Restore-Preflight
          path: preflight/
          if-no-files-found: error
          retention-days: 30
