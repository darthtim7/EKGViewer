name: Temporary external encrypted MDR transport

on:
  pull_request:
    paths:
      - 'mdr-external-encrypted-transport-trigger.txt'

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download encrypted release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p encrypted
          gh release download mdr-encrypted-transport-32219399566 \
            --repo "$GITHUB_REPOSITORY" --dir encrypted
          find encrypted -type f -printf '%f %s bytes\n' | sort
          (cd encrypted && sha256sum * > ENCRYPTED_TRANSPORT_SHA256.txt)

      - name: Upload encrypted files to temporary neutral transport
        shell: bash
        run: |
          set -euo pipefail
          upload_one() {
            local file="$1" name url
            name="$(basename "$file")"
            url=""
            # Litterbox: temporary large-file endpoint; one-hour retention.
            url="$(curl -fsS --retry 2 --connect-timeout 30 \
              -F reqtype=fileupload -F time=1h -F "fileToUpload=@${file}" \
              https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null || true)"
            if [[ "$url" != http* ]]; then
              # temp.sh multipart fallback.
              url="$(curl -fsS --retry 2 --connect-timeout 30 \
                -F "file=@${file}" https://temp.sh/upload 2>/dev/null || true)"
            fi
            if [[ "$url" != http* ]]; then
              # 0x0.st multipart fallback.
              url="$(curl -fsS --retry 2 --connect-timeout 20 -F "file=@${file}" https://0x0.st 2>/dev/null || true)"
            fi
            if [[ "$url" != http* ]]; then
              # transfer.sh PUT fallback.
              url="$(curl -fsS --retry 2 --connect-timeout 20 --upload-file "$file" "https://transfer.sh/${name}" 2>/dev/null || true)"
            fi
            if [[ "$url" != http* ]]; then
              echo "No temporary transport accepted ${name}" >&2
              return 1
            fi
            printf 'TEMP_TRANSPORT_URL %s %s\n' "$name" "$url"
          }
          upload_one encrypted/MDR_Fan_Made_Source_and_Assets_Collection_1.0.0.zip.enc
          upload_one encrypted/MDR_Fan_Made_Collection_AES_Key.rsa
          upload_one encrypted/MDR_Fan_Made_Encrypted_Transport_Manifest.json
          upload_one encrypted/ENCRYPTED_TRANSPORT_SHA256.txt
