name: MRHPD Section 5 Session 1 Checkpoint 1 intake inspection

on:
  pull_request:
    paths:
      - 'mrhpd/cp5/session1/checkpoint1/**'
      - '.github/workflows/mrhpd-cp5-s1-cp1-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-response72:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated execution branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download Response 72 complete restore volume 1
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-72-Complete-Restore-Volume-1-of-2-v2
          path: inputs/volume1
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30677563971

      - name: Download Response 72 complete restore volume 2
        uses: actions/download-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-72-Complete-Restore-Volume-2-of-2-v2
          path: inputs/volume2
          github-token: ${{ github.token }}
          repository: darthtim7/EKGViewer
          run-id: 30677563971

      - name: Compile resilient inspector
        run: |
          python -m py_compile mrhpd/cp5/session1/checkpoint1/inspect_response72.py
          python -m py_compile mrhpd/cp5/session1/checkpoint1/inspect_response72_v2.py

      - name: Inspect exact Response 72 project surfaces
        run: |
          set -euo pipefail
          python mrhpd/cp5/session1/checkpoint1/inspect_response72_v2.py \
            --volume1-dir inputs/volume1 \
            --volume2-dir inputs/volume2 \
            --output-dir inspection_output | tee section5-intake-inspection.log
          echo '=== SECTION 5 INTAKE INSPECTION JSON ==='
          cat inspection_output/MRHPD_RESPONSE72_SECTION5_INTAKE_INSPECTION.json

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-75-Section-5-Intake-Inspection
          path: |
            inspection_output
            section5-intake-inspection.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
