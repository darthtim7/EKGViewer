name: MRHPD Section 5 and entire project complete release

on:
  pull_request:
    branches:
      - mrhpd-cp5-s3-cp2-20260801
    paths:
      - 'mrhpd/cp5/session3/checkpoint3/**'
      - '.github/workflows/mrhpd-cp5-s3-cp3-final.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-entire-project-complete-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out isolated noncontrolling final execution branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned document workbook PDF image and indexing dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            openpyxl==3.1.5 python-docx==1.2.0 reportlab==4.4.3 \
            pypdf==5.9.0 pymupdf==1.26.4 pillow==12.3.0

      - name: Download authoritative Response 81 volumes and verified Response 83 recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/artifacts inputs/response83
          download_named_artifact() {
            local artifact_name="$1"
            local output="$2"
            local artifact_id
            artifact_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id')"
            if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
              echo "Artifact not found: $artifact_name" >&2
              exit 1
            fi
            echo "Downloading $artifact_name as artifact $artifact_id"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$output"
            test -s "$output"
          }
          download_named_artifact 'MRHPD-v3.0.0a-Response-81-Complete-Restore-Volume-1-of-3' inputs/artifacts/response81-volume1-artifact.zip
          download_named_artifact 'MRHPD-v3.0.0a-Response-81-Complete-Restore-Volume-2-of-3' inputs/artifacts/response81-volume2-artifact.zip
          download_named_artifact 'MRHPD-v3.0.0a-Response-81-Complete-Restore-Volume-3-of-3' inputs/artifacts/response81-volume3-artifact.zip
          download_named_artifact 'MRHPD-v3.0.0a-Response-83-Section-5-Session-3-Checkpoint-2-Recovery-Delivery' inputs/artifacts/response83-artifact.zip
          unzip -oq inputs/artifacts/response83-artifact.zip -d inputs/response83

      - name: Reassemble and verify the authoritative Response 81 complete restore
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/reassembly
          for n in 1 2 3; do
            outer="inputs/outer-${n}"
            mkdir -p "$outer"
            unzip -oq "inputs/artifacts/response81-volume${n}-artifact.zip" -d "$outer"
            inner="$(find "$outer" -type f -name '*.zip' -print -quit)"
            if [[ -z "$inner" ]]; then
              echo "No governed inner volume wrapper in artifact $n" >&2
              exit 1
            fi
            unzip -oq "$inner" -d inputs/reassembly
          done
          script="$(find inputs/reassembly -type f -name 'reassemble_response81_complete_restore.py' -print -quit)"
          if [[ -z "$script" ]]; then
            echo 'Response 81 reassembler missing' >&2
            exit 1
          fi
          (
            cd inputs/reassembly
            python "$(basename "$script")"
          )
          restore="$(find inputs/reassembly -maxdepth 1 -type f -name '*.zip' -size 267562561c -print -quit)"
          if [[ -z "$restore" ]]; then
            echo 'Authoritative Response 81 restore not found by byte count' >&2
            find inputs/reassembly -maxdepth 2 -type f -printf '%p %s\n' >&2
            exit 1
          fi
          python - "$restore" <<'PY'
          from pathlib import Path
          import hashlib, json, sys, zipfile
          path=Path(sys.argv[1])
          h=hashlib.sha256()
          with path.open('rb') as handle:
              for block in iter(lambda:handle.read(1024*1024),b''):
                  h.update(block)
          assert path.stat().st_size == 267_562_561
          assert h.hexdigest() == '2e90bb8196a4bbaba100d7924fdb2e88be8ce78c238ce330ca219c7e3cae32b2'
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
          print(json.dumps({'status':'passed','restore':str(path),'bytes':path.stat().st_size,'sha256':h.hexdigest()},indent=2))
          PY
          echo "restore=$restore" >> "$GITHUB_OUTPUT"

      - name: Compile terminal builders
        run: |
          set -euo pipefail
          python -m py_compile mrhpd/cp5/session3/checkpoint3/build_section5_project_complete.py
          python -m py_compile mrhpd/cp5/session3/checkpoint3/verify_section5_project_complete.py

      - name: Build and clean-verify Response 84 complete project release
        run: |
          set -euo pipefail
          python mrhpd/cp5/session3/checkpoint3/build_section5_project_complete.py \
            --response81-restore "${{ steps.baseline.outputs.restore }}" \
            --response83-dir inputs/response83 \
            --dist dist_cp5_s3_cp3 | tee section5-entire-project-complete-build.log

      - name: Independently verify complete release outputs
        run: |
          set -euo pipefail
          python mrhpd/cp5/session3/checkpoint3/verify_section5_project_complete.py \
            dist_cp5_s3_cp3 | tee section5-entire-project-complete-verification.log

      - name: Upload complete project archive artifact delivery
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Complete-Project-Artifact-Delivery
          path: dist_cp5_s3_cp3/*ALL SECTIONS COMPLETE PROJECT THROUGH RESPONSE 84*.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload complete restore volume 1 of 4
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Complete-Restore-Volume-1-of-4
          path: dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Complete Restore Drive Volume 1 of 4.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload complete restore volume 2 of 4
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Complete-Restore-Volume-2-of-4
          path: dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Complete Restore Drive Volume 2 of 4.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload complete restore volume 3 of 4
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Complete-Restore-Volume-3-of-4
          path: dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Complete Restore Drive Volume 3 of 4.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload complete restore volume 4 of 4
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Complete-Restore-Volume-4-of-4
          path: dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Complete Restore Drive Volume 4 of 4.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload complete verification and controls
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Section-5-and-Entire-Project-Complete-Verification
          path: |
            dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Section 5 and Entire Project Complete Verification Delivery *.zip
            dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Entire Project Independent Verification.json
            dist_cp5_s3_cp3/MRHPD_RESPONSE84_SECTION5_ENTIRE_PROJECT_COMPLETE_BUILD_SUMMARY.json
            dist_cp5_s3_cp3/MRHPD v3.0.0a Response 84 Exact File Names.txt
            section5-entire-project-complete-build.log
            section5-entire-project-complete-verification.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MRHPD-v3.0.0a-Response-84-Complete-Release-Failure-Diagnostics
          path: |
            mrhpd/cp5/session3/checkpoint3
            dist_cp5_s3_cp3
            section5-entire-project-complete-build.log
            section5-entire-project-complete-verification.log
            inputs/reassembly/MRHPD_RESPONSE81_COMPLETE_RESTORE_TRANSPORT_MANIFEST.json
            inputs/reassembly/reassemble_response81_complete_restore.py
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
